    autoplay: true
    featuredTrack: "local-yoasobi-gunjou"

  meting:
    api:
      primary: "https://api.injahow.cn/meting/"
      fallback:
        - "https://api.qijieya.cn/meting/"

  sources:
    local:
      # 随项目发布的本地音乐文件，上传项目后其他浏览器也能加载。
      enabled: true
      tracks:
        - id: "local-yoasobi-gunjou"
          title: "群青"
          artist: "YOASOBI"
          cover: "images/music/music-yoasobi-gunjou-cover.jpg"
          audio: "music/local/yoasobi-gunjou.mp3"
          lyrics:
            type: "meting"
            server: "netease"
            id: "1472480890"

    network:
      enabled: true
      default: "cached-json"
      playlists:
        - id: "cached-json"
          type: "json"
          source: "music/network-music-tracks.json"
          enabled: true

        - id: "netease-main"
          type: "meting-playlist"
          server: "netease"
          source: "https://music.163.com/#/playlist?id=14035449837"
          enabled: false
