# mingtian-home 内容配置草稿
# 这份文件暂不参与页面运行，仅用于确认后续要抽取的内容结构。
# 原则：只放“你以后会替换的文案、图片、视频、链接和少量展示参数”。
# 不放 DOM id、aria、动画触发阈值、运行时模型、CSS 响应式补丁等实现细节。

config:
  version: 1
  project: "mingtian-home"
  language: "zh-CN"

site:
  name: "明天"
  title: "明天"
  description: "明天的个人主页，记录技术、兴趣、旅行、作品和日常。"
  author: "明天"
  url: "https://www.wpixiu.cn"

seo:
  title: "明天"
  description: "明天的个人主页，记录技术、兴趣、旅行、作品和日常。"
  keywords:
    - "明天"
    - "个人主页"
    - "AI"
    - "技术博客"
    - "旅行"
    - "作品集"
  ogImage: "images/site-share-card.png"
  robots:
    # 允许正规搜索引擎收录；声明禁止未授权抓取、训练、聚合和商用复用。
    allowIndexing: true
    sitemap: "https://www.wpixiu.cn/sitemap.xml"
    rules:
      - userAgent: "*"
        allow:
          - "/"
        disallow:
          - "/scripts/"
          - "/src/"
          - "/site.config.yaml"
    aiCrawlers:
      disallow:
        - "GPTBot"
        - "ChatGPT-User"
        - "CCBot"
        - "ClaudeBot"
        - "anthropic-ai"
        - "Google-Extended"
        - "PerplexityBot"
        - "Bytespider"
        - "Amazonbot"
    notice:
      text: "本站内容仅供搜索引擎索引和个人浏览，禁止未经授权的批量抓取、模型训练、内容聚合和商用复用。"
  sitemap:
    enabled: true
    output: "sitemap.xml"
    urls:
      - loc: "https://www.wpixiu.cn/"
        changefreq: "monthly"
        priority: 1.0

navigation:
  items:
    - label: "关于"
      target: "about"
    - label: "兴趣"
      target: "interests"
    - label: "博客"
      target: "blog"
    - label: "旅行"
      target: "travel"
    - label: "作品"
      target: "projects"
    - label: "日常"
      target: "daily"

